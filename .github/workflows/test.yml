name: Game checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  games:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: npm --prefix apps/starport ci
      - run: python scripts/check.py
      - name: Build cloud container
        run: docker build -t evening-club:ci .
      - name: Check all 17 games in cloud container
        run: |
          docker run --detach --name evening-club-ci -p 127.0.0.1:28780:10000 evening-club:ci
          python - <<'PY'
          import asyncio, runpy, time
          from urllib.request import urlopen
          for attempt in range(120):
              try:
                  with urlopen('http://127.0.0.1:28780/_health', timeout=1) as r:
                      assert r.status == 200
                      break
              except OSError:
                  time.sleep(.5)
          else:
              raise RuntimeError('Cloud container failed to become ready')
          checks = runpy.run_path('tests/test_stack.py')
          asyncio.run(checks['protocols'](28780))
          PY
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs evening-club-ci || true
          docker rm --force evening-club-ci || true
