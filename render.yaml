services:
  - type: web
    name: evening-club
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_health
    autoDeployTrigger: off
    envVars:
      - key: PORT
        value: "10000"
      # Cloudflare overwrites this header on every request to a public Render web service;
      # per-visitor limits use it. Verify after the first deploy (see README).
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP
